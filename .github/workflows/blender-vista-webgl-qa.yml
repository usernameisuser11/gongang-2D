name: Gongang Blender Vista WebGL visual QA
on:
  push:
    branches: [feat/cinematic-river-and-depth-20261118]
    paths:
      - 'public/assets/models/blender-cinematic-valley.glb'
      - 'public/blender-vista-3d.js'
      - 'test/blender-vista-visual.mjs'
      - '.github/workflows/blender-vista-webgl-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blender-vista-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies and headless Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1 --no-audit --no-fund
          npx playwright install chromium
      - name: Install Korean scene-preview font
        run: |
          mkdir -p ~/.local/share/fonts
          font=~/.local/share/fonts/NotoSansKR.ttf
          if curl --fail --location --retry 2 --max-time 35 \
            'https://raw.githubusercontent.com/google/fonts/b38c5c93af322c45f633e17ac440ec1e6c94d489/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' \
            --output "$font"; then
            fc-cache -f
          else
            echo 'Korean screenshot font unavailable; continuing visual QA'
          fi
      - name: Validate the app, WebGL and mobile framing
        run: |
          npm run check
          node test/blender-vista-visual.mjs
      - name: Upload desktop and portrait screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-vista-real-browser-previews
          path: artifacts/blender-vista
          retention-days: 30
          if-no-files-found: warn
      - name: Save representative scene previews on the feature branch
        if: success()
        run: |
          mkdir -p docs/previews
          cp artifacts/blender-vista/desktop-night-scene.png docs/previews/blender-desktop-night.png
          cp artifacts/blender-vista/mobile-portrait-night-scene.png docs/previews/blender-mobile-night.png
          cp artifacts/blender-vista/desktop-dusk-scene.png docs/previews/blender-desktop-dusk.png
          cp artifacts/blender-vista/mobile-portrait-day-scene.png docs/previews/blender-mobile-day.png
          cp artifacts/blender-vista/desktop-night-scene.jpg docs/previews/blender-desktop-night.jpg
          cp artifacts/blender-vista/desktop-dusk-scene.jpg docs/previews/blender-desktop-dusk.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/blender-desktop-night.png docs/previews/blender-mobile-night.png docs/previews/blender-desktop-dusk.png docs/previews/blender-mobile-day.png docs/previews/blender-desktop-night.jpg docs/previews/blender-desktop-dusk.jpg
          if ! git diff --cached --quiet; then
            git commit -m "art: store real-browser desktop and mobile Blender scene previews"
            git fetch origin feat/cinematic-river-and-depth-20261118
            git rebase origin/feat/cinematic-river-and-depth-20261118
            git push origin HEAD:feat/cinematic-river-and-depth-20261118
          fi
