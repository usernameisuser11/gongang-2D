name: Gongang 2D Stargaze

on:
  pull_request:
  push:
    branches:
      - main
      - feature/stargaze-observatory-20261108
  workflow_dispatch:

jobs:
  quality-and-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install
      - run: npm run check
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/stargaze-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gongang-2d-stargaze-preview
          path: artifacts/stargaze/
          if-no-files-found: ignore
