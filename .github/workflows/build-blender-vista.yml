name: Blender-authored Gongang Vista
on:
  push:
    branches: [feat/cinematic-river-and-depth-20261118]
    paths:
      - "blender/build_cinematic_valley.py"
      - ".github/workflows/build-blender-vista.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author-sculpt-and-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender CPU renderer
        run: |
          # Keep automated asset delivery bounded if an Ubuntu mirror stalls.
          sudo timeout 180 env DEBIAN_FRONTEND=noninteractive apt-get update -qq -o Acquire::Retries=2
          # Ubuntu security mirrors can briefly return HTTP 503 for Blender's
          # dependencies; retry those package downloads before failing CI.
          sudo timeout 300 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends -o Acquire::Retries=6 -o Acquire::http::Timeout=25 blender python3-numpy
          blender --version
      - name: Verify Blender script syntax
        run: python3 -m py_compile blender/build_cinematic_valley.py
      - name: Generate editable .blend, realtime .glb, preview PNG
        run: blender --background --python blender/build_cinematic_valley.py -- --render
      - name: Validate browser and server JavaScript
        run: |
          node --check server.mjs
          node --check public/stargaze.js
          node --check public/blender-vista-3d.js
      - name: Check outputs
        run: |
          test -s blender/output/gongang-cinematic-valley.blend
          test -s public/assets/models/blender-cinematic-valley.glb
          test -s blender/output/cinematic-valley-night.png
          ls -lh blender/output/gongang-cinematic-valley.blend public/assets/models/blender-cinematic-valley.glb blender/output/cinematic-valley-night.png
      - name: Publish preview and editable scene as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gongang-original-blender-art
          path: |
            blender/output/*.png
            blender/output/*.blend
            public/assets/models/blender-cinematic-valley.glb
          retention-days: 30
      - name: Save reproducible Blender assets back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blender/output/gongang-cinematic-valley.blend blender/output/cinematic-valley-night.png public/assets/models/blender-cinematic-valley.glb
          if ! git diff --cached --quiet; then
            git commit -m "art: generate editable Blender scene, glb and preview"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
