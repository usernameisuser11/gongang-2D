name: Gongang reference vista quick capture
on:
  push:
    branches: [threejs-model-assets]
    paths:
      - 'public/reference-vista.js'
      - 'public/stargaze.js'
      - 'public/index.html'
      - 'server.mjs'
      - 'test/reference-vista-quick.mjs'
      - '.github/workflows/reference-vista-quick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright --no-audit --no-fund
          # GitHub's runner already has browser OS dependencies. Avoid
          # apt downloads; apt mirrors have intermittent DNS failures.
          npx playwright install chromium
      - name: Capture coordinate-redrawn vista
        env:
          REFERENCE_QA_NIGHT_ONLY: '1'
        run: node test/reference-vista-quick.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gongang-reference-coordinate-redraw
          path: artifacts/reference-vista/
          if-no-files-found: warn
