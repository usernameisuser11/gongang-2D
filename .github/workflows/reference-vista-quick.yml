name: Gongang reference vista quick capture
on:
  push:
    branches: [threejs-model-assets]
  pull_request:
    branches: [threejs-model-assets]
    paths:
      - 'public/reference-vista.js'
      - 'public/index.html'
      - 'test/reference-vista-quick.mjs'
      - '.github/workflows/reference-vista-quick.yml'
    paths:
      - 'public/reference-vista.js'
      - 'public/stargaze.js'
      - 'public/index.html'
      - 'server.mjs'
      - 'test/reference-vista-quick.mjs'
      - '.github/workflows/reference-vista-quick.yml'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Include day, dusk and mobile rain captures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/threejs-model-assets' || github.base_ref == 'threejs-model-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1 --no-audit --no-fund
          # GitHub's runner already has browser OS dependencies. Avoid
          # apt downloads; apt mirrors have intermittent DNS failures.
          npx playwright install chromium
      - name: Install Korean screenshot font
        run: |
          mkdir -p ~/.local/share/fonts
          font=~/.local/share/fonts/NotoSansKR.ttf
          curl --fail --location --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/google/fonts/b38c5c93af322c45f633e17ac440ec1e6c94d489/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' \
            --output "$font"
          test "$(git hash-object "$font")" = 'b386890ba945e1f39448a6b59f20c5d194f58808'
          fc-cache -f
          fc-match -f '%{family}\n' ':lang=ko'
      - name: Check reference renderer syntax
        run: npm run check:reference
      - name: Capture coordinate-redrawn vista
        env:
          REFERENCE_QA_NIGHT_ONLY: ${{ inputs.full_matrix && '0' || '1' }}
        run: node test/reference-vista-quick.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gongang-reference-coordinate-redraw-${{ github.sha }}
          path: artifacts/reference-vista/
          if-no-files-found: warn
          retention-days: 14
